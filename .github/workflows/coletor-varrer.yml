name: coletor-varrer

# Varredura diária: lê as vagas, filtra e grava; depois a IA avalia e escreve os emails
# (etapa 4) e o relatório sai pelo Resend (etapa 5).
# Diária, ou à mão em Actions → coletor-varrer → Run workflow.
# Plano: docs/planos/2026-10-13-plano-coletor-v1.md

on:
  schedule:
    - cron: "0 6 * * *" # todos os dias, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: coletor
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Instalar dependências (versões do uv.lock)
        run: uv sync --frozen --python 3.12

      - name: Varrer vagas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RELATORIO_DESTINO: ${{ secrets.RELATORIO_DESTINO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: uv run python -m coletor varrer
