[project]
name = "coletor"
version = "0.1.0"
description = "Coletor diário do buscador de vagas (ADR-0001)"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert nos testes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
